# feels — minimal modern packaging metadata.
# Install: `pip install -r requirements.txt` (via setup.sh).
# The app runs as scripts (python realtime_plot.py); this file exists so the
# repo has a standard identity, version, and dependency declaration.
[project]
name = "feels"
version = "0.1.0"
description = "Proprioceptive dynamic identification of sealed container payloads (Viam + MongoDB Atlas)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "viam-sdk>=0.85.0",
    "python-dotenv>=1.0.0",
    "pymongo>=4.10.0",
    "certifi>=2024.0.0",
    "numpy>=1.24.0",
    "aiohttp>=3.9.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
]

[tool.pyflakes]
# no per-file ignores; keep the active scripts clean
